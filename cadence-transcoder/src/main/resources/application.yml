spring:
  application:
    name: cadence-transcoder
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${CADENCE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: cadence-transcoder
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # one CPU-heavy job at a time; allow long transcodes between polls
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 900000
    listener:
      concurrency: ${CADENCE_TRANSCODER_CONCURRENCY:1}

server:
  port: ${CADENCE_TRANSCODER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # latency histograms for p95/p99 in Prometheus (spec 7: playback start < 200 ms p95)
      percentiles-histogram:
        http.server.requests: true
  tracing:
    # trace and span ids are in every log line whatever the sampling; spans are only exported if an exporter is added
    sampling:
      probability: ${CADENCE_TRACING_SAMPLING:0.1}
  endpoint:
    health:
      probes:
        enabled: true

cadence:
  s3:
    endpoint: ${CADENCE_S3_ENDPOINT:http://localhost:9000}
    region: ${CADENCE_S3_REGION:us-east-1}
    access-key: ${CADENCE_S3_ACCESS_KEY:}
    secret-key: ${CADENCE_S3_SECRET_KEY:}
    hls-bucket: ${CADENCE_S3_HLS_BUCKET:cadence-hls}
  transcoder:
    ffmpeg-path: ${CADENCE_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${CADENCE_FFPROBE_PATH:ffprobe}
    timeout: ${CADENCE_TRANSCODE_TIMEOUT:10m}
    # empty = java.io.tmpdir
    work-dir: ${CADENCE_TRANSCODER_WORK_DIR:}
