server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API and JWKS go to cadence-api. The original Host (with its port) builds the playback manifest URLs, so they come
    # back through this proxy. No X-Forwarded-Proto: without X-Forwarded-Port, Tomcat would then reset the port to 80.
    # X-Forwarded-For keeps the per-IP login rate limit per browser.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    # hashed assets are immutable; the SPA shell is never cached
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
