# Local infrastructure for Cadence. Values come from .env (copy .env.example; `make up` does it for you).
name: cadence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cadence-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cadence-net]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers on cadence-net, EXTERNAL for apps running on the host
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks: [cadence-net]

  minio:
    # minio/minio is no longer published; pgsty/minio is a community build of the same server (DECISIONS.md D3)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cadence-net]

  # One-shot: creates the private buckets, then exits (dependents wait for successful completion).
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RAW_BUCKET: ${CADENCE_S3_RAW_BUCKET:-cadence-raw}
      HLS_BUCKET: ${CADENCE_S3_HLS_BUCKET:-cadence-hls}
      APP_ACCESS_KEY: ${CADENCE_S3_ACCESS_KEY:?set CADENCE_S3_ACCESS_KEY in .env}
      APP_SECRET_KEY: ${CADENCE_S3_SECRET_KEY:?set CADENCE_S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$RAW_BUCKET" "local/$$HLS_BUCKET"
        mc anonymous set private "local/$$RAW_BUCKET"
        mc anonymous set private "local/$$HLS_BUCKET"
        # least-privilege credentials for the apps: object read/write on the two buckets only
        cat > /tmp/cadence-app.json <<POLICY
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],
           "Resource":["arn:aws:s3:::$$RAW_BUCKET","arn:aws:s3:::$$HLS_BUCKET"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],
           "Resource":["arn:aws:s3:::$$RAW_BUCKET/*","arn:aws:s3:::$$HLS_BUCKET/*"]}]}
        POLICY
        mc admin policy create local cadence-app /tmp/cadence-app.json
        mc admin user add local "$$APP_ACCESS_KEY" "$$APP_SECRET_KEY"
        mc admin policy attach local cadence-app --user "$$APP_ACCESS_KEY" 2>/dev/null || true
        echo "buckets and app user ready"
    restart: "no"
    networks: [cadence-net]

  # Single node, basic auth over plain HTTP (local only, bound to 127.0.0.1).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # laptops often run with a nearly full disk; don't let the watermark make indices read-only
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [cadence-net]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cadence
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [cadence-net]

  # ---- profile "app": the Cadence services themselves (`make app`) ----
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: cadence-api/Dockerfile
    image: cadence-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    env_file: .env
    environment:
      # in-network addresses override the host-oriented values in .env
      CADENCE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cadence}
      CADENCE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CADENCE_S3_ENDPOINT: http://minio:9000
      CADENCE_ELASTICSEARCH_URIS: http://elasticsearch:9200
      CADENCE_S3_PUBLIC_ENDPOINT: ${CADENCE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      CADENCE_JWT_PRIVATE_KEY_LOCATION: file:/app/secrets/jwt-private.pem
      CADENCE_JWT_PUBLIC_KEY_LOCATION: file:/app/secrets/jwt-public.pem
      CADENCE_API_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${CADENCE_API_PROFILES:-dev}
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${CADENCE_API_PORT:-8080}:8080"
    networks: [cadence-net]

  transcoder:
    profiles: [app]
    build:
      context: .
      dockerfile: cadence-transcoder/Dockerfile
    image: cadence-transcoder:local
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      CADENCE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CADENCE_S3_ENDPOINT: http://minio:9000
      CADENCE_TRANSCODER_PORT: "8081"
      CADENCE_TRANSCODER_WORK_DIR: /tmp/cadence-transcoder
    ports:
      - "127.0.0.1:${CADENCE_TRANSCODER_PORT:-8081}:8081"
    networks: [cadence-net]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: cadence-web/Dockerfile
    image: cadence-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CADENCE_WEB_PORT:-3000}:80"
    networks: [cadence-net]

networks:
  cadence-net:
    name: cadence-net

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  es-data:
