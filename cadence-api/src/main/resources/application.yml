# All environment-specific values come from env vars (documented in .env.example).
# A local .env file is picked up automatically when running from the repo root or the module directory.
spring:
  application:
    name: cadence-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CADENCE_DB_URL:jdbc:postgresql://localhost:5432/cadence}
    username: ${POSTGRES_USER:cadence}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${CADENCE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: cadence-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # fail fast (caches and rate limits fail open) instead of Lettuce's 60 s default
      timeout: 500ms
  cache:
    type: redis
  elasticsearch:
    uris: ${CADENCE_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${CADENCE_ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 10s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${CADENCE_API_PORT:8080}
  # trust X-Forwarded-For only from internal proxies (Tomcat RemoteIpValve defaults: loopback, private ranges)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cadence:
  security:
    jwt:
      # PEM files from scripts/generate-dev-keys.sh; paths are relative to the repo root (the working directory)
      private-key-location: ${CADENCE_JWT_PRIVATE_KEY_LOCATION:file:secrets/jwt-private.pem}
      public-key-location: ${CADENCE_JWT_PUBLIC_KEY_LOCATION:file:secrets/jwt-public.pem}
      issuer: ${CADENCE_JWT_ISSUER:cadence}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  admin:
    email: ${CADENCE_ADMIN_EMAIL:}
    password: ${CADENCE_ADMIN_PASSWORD:}
  rate-limits:
    login:
      capacity: 5
      period: 1m
    search:              # spec 6: 30/s per user (search and suggest share it)
      capacity: 30
      period: 1s
  s3:
    # endpoint the API talks to; public-endpoint is what browsers/players see in presigned URLs
    endpoint: ${CADENCE_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${CADENCE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${CADENCE_S3_REGION:us-east-1}
    access-key: ${CADENCE_S3_ACCESS_KEY:}
    secret-key: ${CADENCE_S3_SECRET_KEY:}
    raw-bucket: ${CADENCE_S3_RAW_BUCKET:cadence-raw}
    hls-bucket: ${CADENCE_S3_HLS_BUCKET:cadence-hls}
    auto-create-buckets: ${CADENCE_S3_AUTO_CREATE_BUCKETS:false}
  catalog:
    max-upload-bytes: 209715200   # 200 MB (spec 6)
    upload-url-ttl: 15m
  streaming:
    manifest-url-ttl: 5m
    segment-url-ttl: 5m
  activity:
    # rebuild of the 30-day track popularity read model
    stats-refresh-interval: ${CADENCE_ACTIVITY_STATS_REFRESH_INTERVAL:5m}
    stats-initial-delay: 30s
  search:
    # index names are <prefix>-artists, -albums, -tracks, -playlists
    index-prefix: ${CADENCE_SEARCH_INDEX_PREFIX:cadence}
  outbox:
    poll-interval: ${CADENCE_OUTBOX_POLL_INTERVAL:500ms}
    batch-size: 100
    send-timeout: 10s
    retention: 7d
  kafka:
    partitions: ${CADENCE_KAFKA_PARTITIONS:3}
    replication-factor: ${CADENCE_KAFKA_REPLICATION_FACTOR:1}
