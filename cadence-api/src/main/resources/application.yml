# All environment-specific values come from env vars (documented in .env.example).
# A local .env file is picked up automatically when running from the repo root or the module directory.
spring:
  application:
    name: cadence-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CADENCE_DB_URL:jdbc:postgresql://localhost:5432/cadence}
    username: ${POSTGRES_USER:cadence}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${CADENCE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: cadence-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${CADENCE_API_PORT:8080}
  # trust X-Forwarded-For only from internal proxies (Tomcat RemoteIpValve defaults: loopback, private ranges)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cadence:
  security:
    jwt:
      # PEM files from scripts/generate-dev-keys.sh; paths are relative to the repo root (the working directory)
      private-key-location: ${CADENCE_JWT_PRIVATE_KEY_LOCATION:file:secrets/jwt-private.pem}
      public-key-location: ${CADENCE_JWT_PUBLIC_KEY_LOCATION:file:secrets/jwt-public.pem}
      issuer: ${CADENCE_JWT_ISSUER:cadence}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  admin:
    email: ${CADENCE_ADMIN_EMAIL:}
    password: ${CADENCE_ADMIN_PASSWORD:}
  rate-limits:
    login:
      capacity: 5
      period: 1m
  outbox:
    poll-interval: ${CADENCE_OUTBOX_POLL_INTERVAL:500ms}
    batch-size: 100
    send-timeout: 10s
    retention: 7d
  kafka:
    partitions: ${CADENCE_KAFKA_PARTITIONS:3}
    replication-factor: ${CADENCE_KAFKA_REPLICATION_FACTOR:1}
